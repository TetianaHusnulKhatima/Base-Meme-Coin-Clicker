<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>4. Meme Clicker</title><style>body{background:#000;color:#0052FF;font-family:sans-serif;text-align:center;}#btn{width:100px;height:100px;background:#0052FF;color:#fff;border-radius:50%;margin:20px auto;line-height:100px;font-weight:bold;cursor:pointer;}</style></head>
<body>
<h1>4. Meme Clicker</h1>
<h2>Cap: $<span id="c">0</span></h2>
<div id="btn">BASE</div>
<script>
let cap=0;
document.getElementById('btn').onclick = () => { cap++; document.getElementById('c').innerText = cap; };
</script>
</body>
</html>
